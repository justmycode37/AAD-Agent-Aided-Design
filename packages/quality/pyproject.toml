[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aad-quality"
version = "0.1.0"
description = "Requirement evidence and conservative process screens for AAD"
requires-python = ">=3.12"
dependencies = ["aad-engine", "PyYAML>=6.0.3,<7"]

[tool.uv.sources]
aad-engine = { workspace = true }

[project.optional-dependencies]
geometry = ["build123d==0.13.0", "cadquery-ocp-novtk==8.0.1.1.0"]
parts = ["bd_warehouse==0.4.0"]
compare = ["numpy>=2,<3", "scipy>=1.14,<2", "vtk==9.7.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aad_quality"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/hatch_build.py", "/README.md", "/SPEC.md", "/PROCESS.md", "/COMPONENTS.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
