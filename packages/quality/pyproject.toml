[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiad-quality"
version = "0.1.0"
description = "Requirement evidence and conservative process screens for AIAD"
requires-python = ">=3.12"
dependencies = ["aiad-engine", "PyYAML>=6.0.3,<7"]

[tool.uv.sources]
aiad-engine = { workspace = true }

[project.optional-dependencies]
geometry = ["build123d==0.13.0", "cadquery-ocp-novtk==8.0.1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aiad_quality"]
