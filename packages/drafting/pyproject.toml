[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "aad-drafting"
version = "0.1.0"
description = "Dimensioned 2D drawing sheets for AAD build123d models"
requires-python = ">=3.12"
dependencies = [
    "build123d==0.13.0",
    "cadquery-ocp-novtk==8.0.1.1.0",
    "ezdxf==1.4.5",
    "Pillow>=10,<13",
    "reportlab>=4,<5",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "svgelements>=1.9.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/aad_drafting"]
