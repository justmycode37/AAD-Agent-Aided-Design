[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aiad-engine"
version = "0.1.0"
description = "M0 build123d worker and public AIAD engine types"
requires-python = ">=3.12"
dependencies = [
    "build123d==0.13.0",
    "cadquery-ocp-novtk==8.0.1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiad"]

[tool.uv]
package = true
