[project]
name = "aiad-render"
version = "0.0.1"
description = "Tessellation and agent renders for AIAD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "ocp-tessellate==3.6.3",
    "pillow>=11",
]

[project.optional-dependencies]
vtk = ["vtk==9.7.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiad_render"]
