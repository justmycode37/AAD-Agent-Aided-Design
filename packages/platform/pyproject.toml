[project]
name = "aiad"
version = "0.0.1"
description = "CAD for agents: CLI, daemon and MCP adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["mcp==2.3.0", "pyyaml>=6", "starlette>=1", "uvicorn>=0.54", "websockets>=15"]

[project.scripts]
aiad = "aiad_platform.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiad_platform"]
