name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      e2e: ${{ steps.discover.outputs.e2e }}
      viewer: ${{ steps.discover.outputs.viewer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Lock file is current
        run: uv lock --check
      - name: Check CI test selection
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - id: discover
        run: python3 .github/scripts/discover.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check Python lint rules
        run: uvx ruff==0.17.4 check .

  packages:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Intel Mac runners are the bottleneck, so only pushes to main use them.
        os: ${{ fromJSON(github.event_name == 'push' && '["macos-15-intel", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    name: ${{ matrix.package.dir }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install graphics and sandbox runtime
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup_linux_runtime.sh
      - name: Run package tests
        run: >-
          uv run --locked --package "${{ matrix.package.name }}" --all-extras
          --with pytest --with pytest-timeout
          python -m pytest "packages/${{ matrix.package.dir }}/tests"

  e2e:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        # Intel Mac runners are the bottleneck, so only pushes to main use them.
        os: ${{ fromJSON(github.event_name == 'push' && '["macos-15-intel", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
    name: e2e smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Includes cold workspace installation and every selected package on Intel Macs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install graphics and sandbox runtime
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup_linux_runtime.sh
      - name: Run integrated workspace and smoke tests
        env:
          AAD_TEST_PACKAGES: ${{ needs.discover.outputs.packages }}
        run: |
          uv run --locked --all-packages --all-extras python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          packages = json.loads(os.environ["AAD_TEST_PACKAGES"])
          tests = [f"packages/{package['dir']}/tests" for package in packages]
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", *tests, "tests/e2e"]))
          PY

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check standalone harness lock file
        run: uv lock --project evals/benchmark/harness --check
      - name: Run offline harness and SDK controls
        run: >-
          uv run --locked --project evals/benchmark/harness --with pytest-timeout
          python -m pytest evals/benchmark/tests/test_agent_loop.py evals/benchmark/tests/test_task_loop.py evals/benchmark/tests/test_provider_sdk.py
      - name: Run statistics and native corpus controls
        run: >-
          uv run --locked --all-packages --all-extras python -m pytest
          evals/benchmark/tests/test_pilot.py evals/benchmark/tests/test_statistics.py evals/benchmark/tests/test_corpus.py

  viewer:
    needs: discover
    if: needs.discover.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - working-directory: viewer
        run: |
          npm ci
          npm run build
          npm test --if-present
          npx playwright install --with-deps chromium
          npm run test:e2e

  # One stable check name that covers the dynamic matrix, including skipped legs.
  ci-ok:
    if: always()
    needs: [discover, packages, e2e, viewer, benchmark, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          required = {"discover", "e2e", "benchmark", "lint"}
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] != "success" and (k in required or v["result"] != "skipped")}
          print("results:", {k: v["result"] for k, v in needs.items()})
          sys.exit(f"failed: {bad}" if bad else 0)
          '
